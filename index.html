

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Fursan Bakery</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f2ef;color:#292323;font-family:Arial,sans-serif}
header{background:#762f37;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;font-size:13px}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:white;padding:17px;border-radius:13px;margin-bottom:15px;box-shadow:0 2px 9px #0000000c}
h2{font-size:18px;margin:0 0 14px;color:#762f37}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{background:#762f37;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#eee;color:#333}
button.danger{background:#a52d2d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.metric{background:#fff;border-radius:12px;padding:15px;text-align:center}
.metric small{color:#777}
.metric strong{display:block;font-size:21px;margin-top:8px;color:#762f37}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid #eee;text-align:left}
.tablewrap{overflow-x:auto}
.hidden{display:none}
.actions{display:flex;gap:5px}
.actions button{padding:7px;font-size:12px}
.note{font-size:13px;color:#777;line-height:1.6}
#message{padding:10px;color:#762f37}
</style>
</head>
<body>
<header>
<h1>🥐 Al Fursan Bakery</h1>
<p>বেকারি ব্যবসার হিসাব • Bakery Management</p>
</header>

<main>
<div id="loginBox" class="card">
<h2>সদস্য লগইন / Member Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">লগইন করুন / Login</button>
<div id="loginMsg" class="note"></div>
</div>

<div id="app" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
<div><b id="welcome">Al Fursan Bakery</b><div class="note">SAR • Saudi Riyal</div></div>
<button style="width:auto" class="secondary" onclick="logout()">লগআউট</button>
</div>
</div>

<div class="grid">
<div class="metric"><small>মোট বিক্রি</small><strong id="salesTotal">0.00 SAR</strong></div>
<div class="metric"><small>মোট খরচ</small><strong id="expenseTotal">0.00 SAR</strong></div>
<div class="metric"><small>অবশিষ্ট</small><strong id="balanceTotal">0.00 SAR</strong></div>
</div>

<div class="card" style="margin-top:15px">
<h2>নতুন হিসাব যোগ করুন</h2>
<label>হিসাবের ধরন</label>
<select id="type">
<option value="sale">বিক্রি / Sale</option>
<option value="expense">খরচ / Expense</option>
</select>
<label>তারিখ</label>
<input id="date" type="date">
<label>সদস্য</label>
<select id="member"></select>
<label>পণ্যের নাম / বিবরণ</label>
<input id="item" placeholder="যেমন: Bread, Cake, Flour">
<label>পরিমাণ (বিক্রির ক্ষেত্রে)</label>
<input id="quantity" type="number" min="0" step="0.01" placeholder="Quantity">
<label>একক মূল্য (SAR)</label>
<input id="unitPrice" type="number" min="0" step="0.01" placeholder="Unit price">
<label>মোট টাকা (SAR)</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount">
<button onclick="saveTransaction()">হিসাব সংরক্ষণ করুন</button>
<button class="secondary hidden" id="cancelEdit" onclick="cancelEdit()">সম্পাদনা বাতিল</button>
<div id="formMsg" class="note"></div>
</div>

<div class="card">
<h2>সদস্যদের হিসাব / Transactions</h2>
<button class="secondary" onclick="loadData()">রিফ্রেশ করুন</button>
<button onclick="exportCSV()">Excel / CSV ডাউনলোড</button>
<div class="tablewrap">
<table>
<thead><tr><th>তারিখ</th><th>ধরন</th><th>সদস্য</th><th>বিবরণ</th><th>টাকা (SAR)</th><th>কাজ</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
<div id="message" class="note"></div>
</div>
</main>

<script>
const SUPABASE_URL = "https://ladmcojnubpigjdgiywn.supabase.co";
const SUPABASE_KEY = "sb_publishable_gQX38_0EydHO7JchLOsFwA_nLzqB3tY";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let transactions = [];
let profiles = [];
let editingId = null;

const $ = id => document.getElementById(id);
const money = n => Number(n || 0).toFixed(2) + " SAR";
const today = new Date().toISOString().slice(0,10);
$("date").value = today;

async function login(){
  $("loginMsg").textContent = "লগইন হচ্ছে...";
  const {data,error} = await db.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){$("loginMsg").textContent = error.message;return;}
  currentUser = data.user;
  await startApp();
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

async function startApp(){
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("welcome").textContent = currentUser.email;
  await loadData();
}

async function loadData(){
  $("message").textContent = "হিসাব লোড হচ্ছে...";
  const [p,t] = await Promise.all([
    db.from("profiles").select("id,display_name").order("created_at"),
    db.from("transactions").select("*").order("entry_date",{ascending:false}).order("created_at",{ascending:false})
  ]);

  if(p.error){$("message").textContent="সদস্য তালিকা: "+p.error.message;return;}
  if(t.error){$("message").textContent="লেনদেন: "+t.error.message;return;}

  profiles = p.data || [];
  transactions = t.data || [];

  $("member").innerHTML = profiles.map(x =>
    `<option value="${x.id}">${escapeHTML(x.display_name || "সদস্য")}</option>`
  ).join("");

  render();
  $("message").textContent = "হিসাব আপডেট হয়েছে।";
}

function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function memberName(id){
  const p = profiles.find(x=>x.id===id);
  return p ? (p.display_name || "সদস্য") : "অজানা সদস্য";
}

function render(){
  const sales = transactions.filter(x=>x.entry_type==="sale")
    .reduce((a,x)=>a+Number(x.amount),0);
  const expenses = transactions.filter(x=>x.entry_type==="expense")
    .reduce((a,x)=>a+Number(x.amount),0);

  $("salesTotal").textContent = money(sales);
  $("expenseTotal").textContent = money(expenses);
  $("balanceTotal").textContent = money(sales-expenses);

  $("rows").innerHTML = transactions.map(x=>`
    <tr>
      <td>${escapeHTML(x.entry_date)}</td>
      <td>${x.entry_type==="sale"?"বিক্রি":"খরচ"}</td>
      <td>${escapeHTML(memberName(x.member_id))}</td>
      <td>${escapeHTML(x.item_name || x.description || x.category || "")}</td>
      <td>${money(x.amount)}</td>
      <td><div class="actions">
        <button onclick="editTransaction('${x.id}')">Edit</button>
        <button class="danger" onclick="deleteTransaction('${x.id}')">Delete</button>
      </div></td>
    </tr>`).join("");
}

async function saveTransaction(){
  const type = $("type").value;
  const amount = Number($("amount").value);
  const memberId = $("member").value;

  if(!memberId){$("formMsg").textContent="সদস্য নির্বাচন করুন।";return;}
  if(!amount || amount<=0){$("formMsg").textContent="সঠিক টাকার পরিমাণ লিখুন।";return;}

  const payload = {
    member_id:memberId,
    created_by:currentUser.id,
    entry_date:$("date").value || today,
    entry_type:type,
    item_name:$("item").value.trim(),
    description:$("item").value.trim(),
    quantity:$("quantity").value ? Number($("quantity").value) : null,
    unit_price:$("unitPrice").value ? Number($("unitPrice").value) : null,
    amount:amount,
    due_status:"paid"
  };

  $("formMsg").textContent="সংরক্ষণ হচ্ছে...";
  let result;
  if(editingId){
    result = await db.from("transactions").update(payload).eq("id",editingId);
  }else{
    result = await db.from("transactions").insert(payload);
  }

  if(result.error){
    $("formMsg").textContent="সমস্যা হয়েছে: "+result.error.message;
    return;
  }

  $("formMsg").textContent="হিসাব সংরক্ষিত হয়েছে।";
  cancelEdit();
  await loadData();
}

function editTransaction(id){
  const x = transactions.find(t=>t.id===id);
  if(!x)return;
  editingId=id;
  $("type").value=x.entry_type;
  $("date").value=x.entry_date;
  $("member").value=x.member_id;
  $("item").value=x.item_name || x.description || "";
  $("quantity").value=x.quantity ?? "";
  $("unitPrice").value=x.unit_price ?? "";
  $("amount").value=x.amount;
  $("cancelEdit").classList.remove("hidden");
  $("formMsg").textContent="এখন তথ্য পরিবর্তন করে সংরক্ষণ করুন।";
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
  editingId=null;
  $("type").value="sale";
  $("date").value=today;
  $("item").value="";
  $("quantity").value="";
  $("unitPrice").value="";
  $("amount").value="";
  $("cancelEdit").classList.add("hidden");
}

async function deleteTransaction(id){
  if(!confirm("এই হিসাবটি মুছে ফেলতে চান?"))return;
  const {error} = await db.from("transactions").delete().eq("id",id);
  if(error){alert("মুছতে সমস্যা: "+error.message);return;}
  await loadData();
}

function exportCSV(){
  const header=["Date","Type","Member","Description","Amount SAR"];
  const lines=transactions.map(x=>[
    x.entry_date,
    x.entry_type,
    memberName(x.member_id),
    x.item_name || x.description || "",
    x.amount
  ]);
  const csv=[header,...lines].map(row=>
    row.map(v=>'"'+String(v ?? "").replace(/"/g,'""')+'"').join(",")
  ).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="al-fursan-bakery-accounts.csv";a.click();
  URL.revokeObjectURL(url);
}

db.auth.getSession().then(async ({data})=>{
  if(data.session){
    currentUser=data.session.user;
    await startApp();
  }
});
</script>
</body>
</html>
